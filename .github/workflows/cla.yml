# Contributor License Agreement: on every pull request, checks that each commit author has signed
# .github/CLA.md, and records a signature when an author comments with the signing sentence. The
# result is the commit status "CLA" on the pull request; require that status in the branch rules.
#
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch of this repository.
# pull_request_target runs this workflow from the base branch with write access, so it never
# checks out or runs code from the pull request.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Signatures are written to one file, so runs are handled one at a time.
concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (github.event.comment.body == 'recheck'
              || contains(github.event.comment.body,
                          'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const SENTENCE = "I have read the CLA Document and I hereby sign the CLA";
            const FILE = "signatures/cla.json";
            const BRANCH = "cla-signatures";
            // GitHub App accounts (names ending in [bot]) cannot sign; the person who opens the
            // pull request signs and is responsible for commits made by the tools they use.
            const ALLOWED = new Set(["chenyme"]);
            const MARKER = "<!-- cla-check -->";
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const documentUrl = `https://github.com/${owner}/${repo}/blob/HEAD/.github/CLA.md`;

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const commits = await github.paginate(github.rest.pulls.listCommits,
              { owner, repo, pull_number: number, per_page: 100 });
            const authors = new Map();
            const unlinked = new Set();
            for (const commit of commits) {
              const user = commit.author;
              if (!user) unlinked.add(commit.commit.author.name);
              else if (user.type !== "Bot" && !user.login.endsWith("[bot]")
                && !ALLOWED.has(user.login.toLowerCase())) authors.set(user.id, user.login);
            }

            let signatures = { signedContributors: [] };
            let fileSha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
              signatures = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
              fileSha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const signed = new Set(signatures.signedContributors.map((entry) => entry.id));

            // A signature is a line that is exactly the sentence, outside quoted (">") lines, so a
            // reply that quotes the request and adds the sentence also counts.
            const comment = context.payload.comment;
            const signs = (body) => body.split(/\r?\n/)
              .filter((line) => !/^\s*>/.test(line))
              .some((line) => line.trim().toLowerCase() === SENTENCE.toLowerCase());
            if (comment && signs(comment.body) && authors.has(comment.user.id) && !signed.has(comment.user.id)) {
              signatures.signedContributors.push({
                name: comment.user.login, id: comment.user.id, comment_id: comment.id,
                created_at: comment.created_at, repoId: context.payload.repository.id, pullRequestNo: number,
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: FILE, branch: BRANCH, sha: fileSha,
                message: `chore: record the CLA signature of ${comment.user.login}`,
                content: Buffer.from(`${JSON.stringify(signatures, null, 2)}\n`).toString("base64"),
              });
              signed.add(comment.user.id);
              core.info(`Recorded the signature of ${comment.user.login}.`);
            }

            const missing = [...authors].filter(([id]) => !signed.has(id)).map(([, login]) => login);
            const passed = missing.length === 0 && unlinked.size === 0;
            const waiting = [...missing, ...unlinked].join(", ");
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: "CLA", target_url: documentUrl,
              state: passed ? "success" : "failure",
              description: (passed ? "All commit authors have signed the CLA" : `Waiting for ${waiting}`).slice(0, 140),
            });

            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: number, per_page: 100 });
            const previous = comments.find((item) => item.user.type === "Bot" && item.body.includes(MARKER));
            let body;
            if (passed) {
              if (!previous) return;
              body = `${MARKER}\nAll commit authors have signed the [Contributor License Agreement](${documentUrl}). Thank you!`;
            } else {
              const lines = [
                MARKER,
                `Thank you for your contribution. Before it can be merged, every commit author signs the [Contributor License Agreement](${documentUrl}) once.`,
              ];
              if (missing.length) {
                lines.push("", `Still to sign: ${missing.map((login) => `@${login}`).join(", ")}. Post a comment on this pull request with this line:`,
                  "", "```", SENTENCE, "```");
              }
              if (unlinked.size) {
                lines.push("", `Some commits are authored with an email address that is not linked to a GitHub account (${[...unlinked].join(", ")}). Add the address to your account under Settings → Emails, or amend the commits, then comment \`recheck\`.`);
              }
              lines.push("", "Comment `recheck` to run this check again.");
              body = lines.join("\n");
            }
            if (previous?.body === body) return;
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
