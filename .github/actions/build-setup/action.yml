name: Build setup
description: Restore target-specific Rust toolchains and caches for the verified source.

inputs:
  target:
    description: Rust target triple; also separates compilation caches.
    required: true
  source-sha:
    description: Immutable source commit used by this build.
    required: true

runs:
  using: composite
  steps:
    - name: Verify source commit
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: node release/common/source.mjs
    - uses: actions/setup-node@v7
      with:
        node-version: "26.12.1"
        package-manager-cache: false
    # Installs the release compiler with the build target. Keep the version equal to
    # rust-toolchain.toml. RUSTUP_TOOLCHAIN makes every later `cargo` in the job use it.
    - uses: dtolnay/rust-toolchain@stable
      id: rust
      with:
        toolchain: "1.99.1"
        targets: ${{ inputs.target }}
    - name: Use the release toolchain for later steps
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.rust.outputs.name }}
      run: echo "RUSTUP_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: release-${{ inputs.target }}
